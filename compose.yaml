services:
  app:
    image: ${CW_CR_IMAGE:-ghcr.io/bennie-asi/cw-cr:latest}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - cw-cr-data:/data
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
      DJANGO_TRUST_PROXY: ${DJANGO_TRUST_PROXY:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/db.sqlite3}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      GITLAB_URL: ${GITLAB_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      CCSWITCH_BASE_URL: ${CCSWITCH_BASE_URL:-}
      CCSWITCH_API_KEY: ${CCSWITCH_API_KEY:-}
      CCSWITCH_MODEL: ${CCSWITCH_MODEL:-}
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 190s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  cw-cr-data:
